<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}"></head>
  <body>
    <div class="flex h-screen bg-gray-50">
      <!-- Sidebar Desktop -->
      <aside th:replace="~{layout :: sidebar}"></aside>

      <div class="flex flex-col flex-1 w-full">
        <header th:replace="~{layout :: header}"></header>

        <main class="h-full pb-16 overflow-y-auto">
          <div class="container grid px-6 mx-auto">
            <div class="flex justify-between items-center my-6">
              <h2 class="text-2xl font-semibold text-gray-700">
                Daftar Kunjungan
              </h2>
              <div class="relative w-1/">
                <div class="absolute inset-y-0 flex items-center pl-2">
                  <svg
                    class="w-4 h-4"
                    aria-hidden="true"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </div>
                <input
                  class="w-full pl-8 pr-2 text-sm text-gray-700 placeholder-gray-600 bg-white border-0 rounded-md dark:placeholder-gray-500 dark:bg-gray-700 dark:text-gray-200 focus:placeholder-gray-500 focus:bg-white focus:border-purple-300 focus:outline-none form-input"
                  type="text"
                  placeholder="Search Data"
                  aria-label="Search"
                />
              </div>
            </div>

            <div class="w-full overflow-hidden rounded-lg shadow-xs">
              <div class="w-full overflow-x-auto">
                <table class="w-full whitespace-no-wrap">
                  <thead>
                    <tr
                      class="text-xs font-semibold tracking-wide text-left text-gray-500 uppercase border-b bg-gray-50"
                    >
                      <th class="px-4 py-3">No</th>
                      <th class="px-4 py-3">Nama</th>
                      <th class="px-4 py-3">Jenis Tamu</th>
                      <th class="px-4 py-3">Jenis Kelamin</th>
                      <th class="px-4 py-3">Tujuan</th>
                      <th class="px-4 py-3">Tanggal</th>
                      <th class="px-4 py-3">Jam</th>
                      <th class="px-4 py-3">Aksi</th>
                    </tr>
                  </thead>
                  <tbody
                    class="bg-white divide-y dark:divide-gray-700 dark:bg-gray-800"
                    id="table-body"
                  >
                    <!-- Table rows generated by JS -->
                    <tr class="text-gray-700" th:each="guest, start : ${guests}">
                      <td class="px-4 py-3" th:text="${start.index + 1}"></td>
                      <td class="px-4 py-3" th:text="${guest.modelGuest.name}"></td>
                      <td class="px-4 py-3" th:text="${guest.modelGuest.guestType}"></td>
                      <td class="px-4 py-3" th:text="${guest.modelGuest.gender}"></td>
                      <td class="px-4 py-3" th:text="${guest.title}"></td>
                      <td class="px-4 py-3" th:text="${#temporals.format(guest.createdAt, 'yyyy-MM-dd')}"></td>
                      <td class="px-4 py-3" th:text="${#temporals.format(guest.createdAt, 'HH:mm')}"></td>
                      <td class="px-4 py-3 flex space-x-4"> <!-- Mengubah space-x-10 menjadi space-x-4 untuk jarak lebih kecil -->
                        <button class="button detail mr-2">
                          <img th:src="@{img/detail.png}" alt="Detail" class="icon" width="20" height="20" />
                        </button>
                        <a class="button ubah mr-2" th:href="@{/tamu/edit/(id=${guest.modelGuest.id})}">
                          <img th:src="@{img/edit.png}" alt="Detail" class="icon" width="20" height="20" />
                        </a>
                        <a class="button hapus" th:href="@{/tamu/edit/(id=${guest.modelGuest.id})}">
                          <img th:src="@{/img/delete.png}" alt="Detail" class="icon" width="20" height="20" />
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Pagination -->
              <div
                class="flex flex-col items-center justify-between px-4 py-3 text-xs font-semibold tracking-wide text-gray-500 uppercase border-t bg-gray-50 sm:flex-row"
              >
                <span id="pagination-summary"></span>
                <div>
                <span th:if="${currentPage > 0}">
                    <a th:href="@{/tamu(page=${currentPage - 1}, size=${10})}"
                       class="px-3 py-1 rounded-md focus:outline-none focus:shadow-outline-purple">Previous</a>
                </span>

                  <span th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                    <a th:href="@{/tamu(page=${i}, size=${10})}" th:text="${i+1}"
                       class="px-3 py-1 rounded-md focus:outline-none focus:shadow-outline-purple"></a>
                </span>

                  <span th:if="${currentPage < totalPages - 1}">
                    <a th:href="@{/tamu(page=${currentPage + 1}, size=${10})}"
                       class="px-3 py-1 rounded-md focus:outline-none focus:shadow-outline-purple">Next</a>
                </span>
                </div>
              </div>

            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{js/init-alpine.js}"></script>
  </body>
</html>
