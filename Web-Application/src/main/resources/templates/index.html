<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head}"></head>
  <body>
    <div class="flex h-screen bg-gray-50">
      <!-- Desktop sidebar -->
      <aside
        class="z-20 flex-shrink-0 hidden w-64 overflow-y-auto bg-blue-500 md:block"
      >
        <div class="py-4 text-white">
          <!-- Ubah warna teks ke putih -->
          <a class="ml-6 text-lg font-bold" href="#">Buku Tamu</a>
          <ul class="mt-6">
            <li class="relative px-6 py-3">
              <a
                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                th:href="@{/}"
              >
                <img class="w-5 h-5" th:src="@{img/home.png}" alt="Kunjungan" />
                <span class="ml-4">Dashboard</span>
              </a>
            </li>
            <li class="relative px-6 py-3">
              <a
                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                th:href="@{/tamu}"
              >
                <img
                  class="w-5 h-5"
                  th:src="@{img/kunjungan.png}"
                  alt="Kunjungan"
                />
                <span class="ml-4">Kunjungan</span>
              </a>
            </li>
            <li class="relative px-6 py-3">
              <a
                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                th:href="@{/tamu/tambah}"
              >
                <img class="w-5 h-5" th:src="@{img/add.png}" alt="Kunjungan" />
                <span class="ml-4">Input</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <div class="flex flex-col flex-1 w-full">
        <header th:replace="~{layout :: header}"></header>

        <main class="h-full overflow-y-auto">
          <div class="container px-6 mx-auto grid">
            <h2 class="my-6 text-2xl font-semibold text-gray-700">Dashboard</h2>

            <div class="flex justify-between mb-8 gap-2">
              <!-- Card 1 -->
              <div
                class="custom-card p-6 bg-white rounded-lg shadow-xs flex items-center"
              >
                <img
                  class="w-8 h-8 mr-4"
                  th:src="@{img/people.png}"
                  alt="Kunjungan"
                />
                <div>
                  <p class="mb-2 text-sm font-medium text-gray-600">
                    Total Tamu
                  </p>
                  <p class="text-lg font-semibold text-gray-700">6389</p>
                </div>
              </div>

              <!-- Card 2 -->
              <div
                class="custom-card p-6 bg-white rounded-lg shadow-xs flex items-center"
              >
                <img
                  class="w-8 h-8 mr-4"
                  th:src="@{img/lembaga.png}"
                  alt="Tamu Lembaga"
                />
                <div>
                  <p class="mb-2 text-sm font-medium text-gray-600">
                    Tamu Lembaga
                  </p>
                  <p class="text-lg font-semibold text-gray-700">****</p>
                </div>
              </div>

              <!-- Card 3 -->
              <div
                class="custom-card p-6 bg-white rounded-lg shadow-xs flex items-center"
              >
                <img
                  class="w-8 h-8 mr-4"
                  th:src="@{img/personal.png}"
                  alt="Tamu Perorangan"
                />
                <div>
                  <p class="mb-2 text-sm font-medium text-gray-600">
                    Tamu Perorangan
                  </p>
                  <p class="text-lg font-semibold text-gray-700">****</p>
                </div>
              </div>
            </div>
            <h2 class="my-6 text-2xl text-gray-700">Grafik Kunjungan</h2>
            <div class="grid gap-6 mb-6 md:grid-cols-2">
              <!-- Line Chart - Kolom Kiri -->
              <div
                class="min-w-0 p-4 bg-white rounded-lg shadow-xs dark:bg-gray-800"
              >
                <h4 class="mb-4 font-semibold text-gray-800 dark:text-gray-300">
                  Grafik Garis
                </h4>
                <canvas id="line"></canvas>
                <div
                  class="flex justify-center mt-4 space-x-3 text-sm text-gray-600 dark:text-gray-400"
                >
                  <div class="flex items-center">
                    <span
                      class="inline-block w-3 h-3 mr-1 bg-blue-600 rounded-full"
                    ></span>
                    <span>Lembaga</span>
                  </div>
                  <div class="flex items-center">
                    <span
                      class="inline-block w-3 h-3 mr-1 bg-teal-500 rounded-full"
                    ></span>
                    <span>Perorangan</span>
                  </div>
                </div>
              </div>

              <!-- Doughnut/Pie Chart - Kolom Kanan -->
              <div
                class="min-w-0 p-4 bg-white rounded-lg shadow-xs dark:bg-gray-00"
              >
                <h4 class="mb-4 font-semibold text-gray-800 dark:text-gray-300">
                  Grafik Lingkaran
                </h4>
                <canvas id="pie"></canvas>
                <div
                  class="flex justify-center mt-4 space-x-3 text-sm text-gray-600 dark:text-gray-400"
                >
                  <div class="flex items-center">
                    <span
                      class="inline-block w-3 h-3 mr-1 bg-blue-600 rounded-full"
                    ></span>
                    <span>Lembaga</span>
                  </div>
                  <div class="flex items-center">
                    <span
                      class="inline-block w-3 h-3 mr-1 bg-teal-500 rounded-full"
                    ></span>
                    <span>Perorangan</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- New Table -->
            <div class="w-full overflow-hidden rounded-lg shadow-xs">
              <div class="w-full overflow-x-auto">
                <table class="w-full whitespace-no-wrap">
                  <thead>
                    <tr
                      class="text-xs font-semibold tracking-wide text-left text-gray-500 uppercase border-b bg-gray-50"
                    >
                      <th class="px-4 py-3">Nama</th>
                      <th class="px-4 py-3">Jabatan</th>
                      <th class="px-4 py-3">Instansi</th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y">
                    <tr class="text-gray-700">
                      <td class="px-4 py-3 text-sm">John Doe</td>
                      <td class="px-4 py-3 text-sm">CEO</td>
                      <td class="px-4 py-3 text-sm">Company XYZ</td>
                    </tr>
                    <tr class="text-gray-700">
                      <td class="px-4 py-3 text-sm">Jane Smith</td>
                      <td class="px-4 py-3 text-sm">Manager</td>
                      <td class="px-4 py-3 text-sm">Organization ABC</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{js/charts-lines.js}" defer></script>
    <script th:src="@{js/charts-pie.js}" defer></script>
  </body>
</html>
