<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}"></title>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/tailwind.output.css}" />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.css"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <script
            src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js"
            defer
    ></script>
    <script
            src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js"
            defer
    ></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        .custom-card {
            width: 380px; /* Atur lebar sesuai kebutuhan */
        }

        .button {
            padding: 7px 7px; /* Ukuran tombol diubah */
            border: none;
            border-radius: 7px; /* Radius tombol */
            font-size: 16px; /* Ukuran font diubah */
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .detail {
            background-color: #ffc111; /* Warna Detail */
            color: black;
        }
        .ubah {
            background-color: #6961ce; /* Warna Ubah */
            color: white;
        }
        .hapus {
            background-color: #d5313c; /* Warna Hapus */
            color: white;
        }
        .button:hover {
            filter: brightness(90%);
        }
    </style>
</head>
<body>
    <div class="flex h-screen bg-gray-50">
        <aside
            class="z-20 flex-shrink-0 hidden w-64 overflow-y-auto bg-blue-500 md:block"
            th:fragment="sidebar"
        >
            <div class="py-4 text-white">
                <!-- Ubah warna teks ke putih -->
                <a class="ml-6 text-lg font-bold" href="#">Buku Tamu</a>
                <ul class="mt-6">
                    <li class="relative px-6 py-3">
                        <a
                                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                                th:href="@{/}"
                        >
                            <img class="w-5 h-5" th:src="@{/img/home.png}" alt="Kunjungan" />
                            <span class="ml-4">Dashboard</span>
                        </a>
                    </li>
                    <li class="relative px-6 py-3">
                        <a
                                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                                th:href="@{/tamu}"
                        >
                            <img
                                    class="w-5 h-5"
                                    th:src="@{/img/kunjungan.png}"
                                    alt="Kunjungan"
                            />
                            <span class="ml-4">Kunjungan</span>
                        </a>
                    </li>
                    <li class="relative px-6 py-3">
                        <a
                                class="inline-flex items-center w-full text-sm font-semibold transition-colors duration-150"
                                th:href="@{/tamu/tambah}"
                        >
                            <img class="w-5 h-5" th:src="@{/img/add.png}" alt="Kunjungan" />
                            <span class="ml-4">Input</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="flex flex-col flex-1 w-full">
            <header class="z-10 py-4 bg-white shadow-md" th:fragment="header">
                <div
                        class="container flex items-center justify-end h-full px-6 mx-auto text-purple-600"
                >
                    <!-- justify-end untuk meratakan ke kanan -->
                    <div class="flex items-center space-x-4">
                        <span class="text-lg font-semibold text-blue-500">Hii Admin</span>
                        <!-- Teks "Hi Admin" -->
                        <button
                            class="align-middle rounded-full focus:shadow-outline-purple focus:outline-none"
                            aria-label="Account"
                            aria-haspopup="true"
                        >
                            <img
                                class="object-cover w-8 h-8 rounded-full"
                                th:src="@{/img/user.png}"
                                alt="Profile Picture"
                                aria-hidden="true"
                            />
                        </button>
                    </div>
                </div>
            </header>
        </div>

    </div>
</body>
</html>
